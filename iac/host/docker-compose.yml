# Runtime definition for the doc-hub Docker host (/opt/doc-hub).
#
# Shipped by the `deploy` job in .github/workflows/build-images.yml, which packs
# this directory onto the host and then runs `docker compose pull && up -d`.
# Editing it is a git push — the instance itself never needs to be replaced.
#
# Two files sit next to it on the host and are *not* shipped from here:
#   .env         ACME_EMAIL, written once by iac/user-data.sh
#   secrets.env  the Strapi and PostgreSQL credentials, written by the deploy
#                job from the repository secrets (see iac/deploy.sh)
#
# This is the same system the helm/ charts install on a local cluster, with the
# same env vars — the ConfigMap keys in helm/<component>/templates/configmap.yaml
# are these names. What differs is what a service name resolves to: on the
# compose network `doc-registry` is a container rather than a Service, which is
# why REGISTRY_API_URL still reads http://doc-registry:1337 here.

name: doc-hub

services:
  # The only service bound to the host. Every application is reachable
  # exclusively through it, so none of them can be hit over plain HTTP.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in /opt/doc-hub/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys. Losing this volume means re-issuing
      # five certificates from scratch, which is how you meet Let's Encrypt's
      # duplicate-certificate rate limit.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      doc-portal:
        condition: service_healthy
      doc-registry:
        condition: service_healthy
      doc-sm:
        condition: service_healthy
      doc-em:
        condition: service_healthy
      doc-es:
        condition: service_healthy

  # The catalogue. Server-rendered, so it reads the registry over the compose
  # network on every request — REGISTRY_URL and REGISTRY_API_URL are the same
  # CMS seen from two places, and collapsing them breaks whichever caller you
  # were not thinking about (see helm/doc-portal/values.yaml).
  doc-portal:
    image: ghcr.io/vondacho/doc-hub/doc-portal:latest
    restart: unless-stopped
    # No `ports`: reachable on the compose network only.
    expose:
      - "4321"
    environment:
      HOST: 0.0.0.0
      PORT: 4321
      NODE_ENV: production
      # Browser-facing links to the neighbouring hubs. They point at names that
      # only resolve once those hubs are deployed; until then they are dead
      # links, exactly as an unset value would be.
      API_PORTAL_URL: https://api-portal.obya.ch
      MODEL_PORTAL_URL: https://arch-portal.obya.ch
      MODEL_C4_URL: https://arch-c4.obya.ch
      MODEL_EVENTCATALOG_URL: https://arch-eventcatalog.obya.ch
      DEV_PORTAL_URL: https://dev-portal.obya.ch
      QA_PORTAL_URL: https://qa-portal.obya.ch
      # The CMS as the browser sees it.
      REGISTRY_URL: https://doc-registry.obya.ch
      # The same CMS as this server sees it. The one address here that is not
      # browser-facing, and the one that must not be a public host name.
      REGISTRY_API_URL: http://doc-registry:1337
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4321/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # The story mapping board.
  doc-sm:
    image: ghcr.io/vondacho/doc-hub/doc-sm:latest
    restart: unless-stopped
    expose:
      - "4322"
    environment:
      HOST: 0.0.0.0
      PORT: 4322
      NODE_ENV: production
      DOC_PORTAL_URL: https://doc-portal.obya.ch
      REGISTRY_URL: https://doc-registry.obya.ch
      REGISTRY_API_URL: http://doc-registry:1337
      # No ticketing system wired up. Empty is the chart's default too, and the
      # board hides the feature rather than failing.
      TICKETING_API_URL: ""
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4322/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # The example mapping board.
  doc-em:
    image: ghcr.io/vondacho/doc-hub/doc-em:latest
    restart: unless-stopped
    expose:
      - "4323"
    environment:
      HOST: 0.0.0.0
      PORT: 4323
      NODE_ENV: production
      DOC_PORTAL_URL: https://doc-portal.obya.ch
      # The practice this board implements, written up in dev-hub.
      PRACTICE_URL: https://dev-portal.obya.ch/doc/practices/example-mapping/
      REGISTRY_URL: https://doc-registry.obya.ch
      REGISTRY_API_URL: http://doc-registry:1337
      STORY_MAPPER_URL: https://doc-sm.obya.ch
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4323/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # The event storming board.
  doc-es:
    image: ghcr.io/vondacho/doc-hub/doc-es:latest
    restart: unless-stopped
    expose:
      - "4324"
    environment:
      HOST: 0.0.0.0
      PORT: 4324
      NODE_ENV: production
      DOC_PORTAL_URL: https://doc-portal.obya.ch
      PRACTICE_URL: https://dev-portal.obya.ch/doc/practices/event-storming/
      REGISTRY_URL: https://doc-registry.obya.ch
      REGISTRY_API_URL: http://doc-registry:1337
      STORY_MAPPER_URL: https://doc-sm.obya.ch
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:4324/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # The CMS holding the product registry. Migrates its own schema on boot, so it
  # waits for the database to be genuinely ready rather than merely started.
  doc-registry:
    image: ghcr.io/vondacho/doc-hub/doc-registry:latest
    restart: unless-stopped
    expose:
      - "1337"
    # APP_KEYS, API_TOKEN_SALT, ADMIN_JWT_SECRET, TRANSFER_TOKEN_SALT,
    # JWT_SECRET, ENCRYPTION_KEY and DATABASE_PASSWORD. Strapi refuses to boot
    # without them, which is the failure to expect on a host that has never had
    # a deploy with the repository secrets set.
    env_file:
      - ./secrets.env
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      NODE_ENV: production
      # Strapi builds the admin panel's absolute URLs from this. Left unset, the
      # panel calls back to host:port, which does not resolve from a browser.
      URL: https://doc-registry.obya.ch
      STRAPI_TELEMETRY_DISABLED: "true"
      STRAPI_DISABLE_UPDATE_NOTIFICATION: "true"
      # Both are idempotent: the seed only fills an empty collection, and the
      # grant only adds find/findOne for the public role — which is what lets
      # doc-portal read the catalogue with no API token.
      SEED_PRODUCTS: "true"
      PUBLIC_READ: "true"
      DATABASE_CLIENT: postgres
      DATABASE_HOST: doc-registry-db
      DATABASE_PORT: "5432"
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_SSL: "false"
      DATABASE_POOL_MIN: "2"
      DATABASE_POOL_MAX: "10"
      DATABASE_CONNECTION_TIMEOUT: "60000"
    volumes:
      # Not in the chart, and deliberate. There, uploads are an emptyDir because
      # a pod is cattle; here the Media Library would otherwise be emptied by
      # every deploy, for the price of a named volume on a disk that is already
      # paid for. Everything that matters is still in the database.
      - registry_uploads:/app/public/uploads
    depends_on:
      doc-registry-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:1337/_health"]
      interval: 15s
      timeout: 5s
      retries: 5
      # The first boot migrates the full schema against an empty database and
      # seeds it before the server listens. The chart budgets 60 x 5s for the
      # same window.
      start_period: 180s

  # The one piece of state in doc-hub. Stock PostgreSQL plus this repo's initdb
  # scripts — see doc-registry-db/Dockerfile, which also pins PGDATA to a
  # subdirectory of the mount.
  doc-registry-db:
    image: ghcr.io/vondacho/doc-hub/doc-registry-db:latest
    restart: unless-stopped
    # POSTGRES_PASSWORD. The image carries no credential by design.
    env_file:
      - ./secrets.env
    expose:
      - "5432"
    volumes:
      - registry_db:/var/lib/postgresql/data
    healthcheck:
      # pg_isready rather than a TCP probe: the latter passes while the cluster
      # is still recovering, and Strapi would connect too early and fail its
      # migration.
      test: ["CMD-SHELL", "pg_isready -U strapi -d strapi"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  caddy_data:
  caddy_config:
  registry_db:
  registry_uploads:
