<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 372" width="820" height="372" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <title>An example map</title>
  <desc>One yellow story card above four blue rule cards, with green example cards under three of them and a red question card under the fourth.</desc>

  <rect x="0" y="0" width="820" height="372" rx="10" fill="#f4f6f9"/>

  <!-- story -->
  <rect x="310" y="16" width="200" height="48" rx="3" fill="#f7e463" stroke="#d5c134"/>
  <text x="410" y="38" font-size="11" fill="#4a3f00" text-anchor="middle" letter-spacing="1.2">STORY</text>
  <text x="410" y="55" font-size="13" fill="#1f2937" text-anchor="middle">Redeem a voucher</text>

  <!-- connectors story -> rules -->
  <g stroke="#8b95a5" stroke-width="1.2" fill="none">
    <path d="M410 64 V82 H127 V102"/>
    <path d="M410 64 V82 H322 V102"/>
    <path d="M410 64 V82 H517 V102"/>
    <path d="M410 64 V82 H712 V102"/>
  </g>

  <!-- rules -->
  <g fill="#7ab8f5" stroke="#4a95dd">
    <rect x="40" y="102" width="175" height="48" rx="3"/>
    <rect x="235" y="102" width="175" height="48" rx="3"/>
    <rect x="430" y="102" width="175" height="48" rx="3"/>
    <rect x="625" y="102" width="175" height="48" rx="3"/>
  </g>
  <g font-size="12" fill="#10233a" text-anchor="middle">
    <text x="127" y="123">Voucher must not be</text>
    <text x="127" y="139">expired</text>
    <text x="322" y="131">One voucher per order</text>
    <text x="517" y="123">Discount never exceeds</text>
    <text x="517" y="139">the order total</text>
    <text x="712" y="123">Applies to eligible</text>
    <text x="712" y="139">items only</text>
  </g>

  <!-- examples -->
  <g fill="#a5d977" stroke="#7fbc50">
    <rect x="40" y="168" width="175" height="44" rx="3"/>
    <rect x="40" y="224" width="175" height="44" rx="3"/>
    <rect x="235" y="168" width="175" height="44" rx="3"/>
    <rect x="430" y="168" width="175" height="44" rx="3"/>
    <rect x="430" y="224" width="175" height="44" rx="3"/>
  </g>
  <g font-size="12" fill="#12280a" text-anchor="middle">
    <text x="127" y="187">Expired yesterday</text>
    <text x="127" y="202">→ refused</text>
    <text x="127" y="243">Expires tomorrow</text>
    <text x="127" y="258">→ accepted</text>
    <text x="322" y="187">A second voucher</text>
    <text x="322" y="202">→ refused</text>
    <text x="517" y="187">20% off 50.00</text>
    <text x="517" y="202">→ 10.00 off</text>
    <text x="517" y="243">100% off 30.00</text>
    <text x="517" y="258">→ 30.00 off</text>
  </g>

  <!-- question -->
  <rect x="625" y="168" width="175" height="44" rx="3" fill="#ef8ba0" stroke="#cf3d59"/>
  <text x="712" y="187" font-size="12" fill="#3b0713" text-anchor="middle">Do sale items count</text>
  <text x="712" y="202" font-size="12" fill="#3b0713" text-anchor="middle">as eligible?</text>

  <text x="712" y="243" font-size="11.5" fill="#5b6472" text-anchor="middle" font-style="italic">no examples yet —</text>
  <text x="712" y="258" font-size="11.5" fill="#5b6472" text-anchor="middle" font-style="italic">the rule is not understood</text>

  <!-- legend -->
  <g font-size="11.5" fill="#3d4551">
    <rect x="40" y="300" width="14" height="14" rx="2" fill="#f7e463" stroke="#d5c134"/>
    <text x="60" y="311">story — exactly one</text>
    <rect x="205" y="300" width="14" height="14" rx="2" fill="#7ab8f5" stroke="#4a95dd"/>
    <text x="225" y="311">rule</text>
    <rect x="285" y="300" width="14" height="14" rx="2" fill="#a5d977" stroke="#7fbc50"/>
    <text x="305" y="311">example, with real values</text>
    <rect x="475" y="300" width="14" height="14" rx="2" fill="#ef8ba0" stroke="#cf3d59"/>
    <text x="495" y="311">question nobody in the room can answer</text>
  </g>
  <text x="40" y="342" font-size="12" fill="#5b6472">Twenty-five minutes, one story. The shape of the finished map says what to do next.</text>
</svg>
