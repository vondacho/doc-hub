<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 392" width="820" height="392" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <title>A story map</title>
  <desc>A backbone of user activities along the top, tasks stacked underneath in order of necessity, and horizontal slices cutting the whole map into releases.</desc>

  <rect x="0" y="0" width="820" height="392" rx="10" fill="#f4f6f9"/>

  <!-- backbone -->
  <g fill="#7ab8f5" stroke="#4a95dd">
    <rect x="170" y="24" width="118" height="44" rx="3"/>
    <rect x="298" y="24" width="118" height="44" rx="3"/>
    <rect x="426" y="24" width="118" height="44" rx="3"/>
    <rect x="554" y="24" width="118" height="44" rx="3"/>
    <rect x="682" y="24" width="118" height="44" rx="3"/>
  </g>
  <g font-size="12" fill="#10233a" text-anchor="middle">
    <text x="229" y="51">Find a product</text>
    <text x="357" y="51">Choose it</text>
    <text x="485" y="51">Pay</text>
    <text x="613" y="51">Track delivery</text>
    <text x="741" y="51">Get help</text>
  </g>
  <g stroke="#4a95dd" stroke-width="1.4" fill="none">
    <path d="M288 46 H298"/>
    <path d="M416 46 H426"/>
    <path d="M544 46 H554"/>
    <path d="M672 46 H682"/>
  </g>

  <!-- slice 1 -->
  <g fill="#ffffff" stroke="#9aa5b4">
    <rect x="170" y="94" width="118" height="42" rx="3"/>
    <rect x="298" y="94" width="118" height="42" rx="3"/>
    <rect x="426" y="94" width="118" height="42" rx="3"/>
    <rect x="554" y="94" width="118" height="42" rx="3"/>
    <rect x="682" y="94" width="118" height="42" rx="3"/>
  </g>
  <g font-size="11.5" fill="#1f2937" text-anchor="middle">
    <text x="229" y="120">Browse catalogue</text>
    <text x="357" y="120">See one product</text>
    <text x="485" y="120">Pay by card</text>
    <text x="613" y="120">See a status</text>
    <text x="741" y="120">Contact form</text>
  </g>

  <!-- slice 2 -->
  <g fill="#ffffff" stroke="#9aa5b4">
    <rect x="170" y="154" width="118" height="42" rx="3"/>
    <rect x="298" y="154" width="118" height="42" rx="3"/>
    <rect x="426" y="154" width="118" height="42" rx="3"/>
    <rect x="554" y="154" width="118" height="42" rx="3"/>
    <rect x="682" y="154" width="118" height="42" rx="3"/>
  </g>
  <g font-size="11.5" fill="#1f2937" text-anchor="middle">
    <text x="229" y="180">Search by name</text>
    <text x="357" y="180">Compare two</text>
    <text x="485" y="180">Save the card</text>
    <text x="613" y="180">Get an e-mail</text>
    <text x="741" y="180">Return an item</text>
  </g>

  <!-- slice 3 -->
  <g fill="#ffffff" stroke="#9aa5b4">
    <rect x="170" y="214" width="118" height="42" rx="3"/>
    <rect x="298" y="214" width="118" height="42" rx="3"/>
    <rect x="426" y="214" width="118" height="42" rx="3"/>
    <rect x="554" y="214" width="118" height="42" rx="3"/>
  </g>
  <g font-size="11.5" fill="#1f2937" text-anchor="middle">
    <text x="229" y="240">Filter by size</text>
    <text x="357" y="240">Read reviews</text>
    <text x="485" y="240">Pay by wallet</text>
    <text x="613" y="240">Live map</text>
  </g>

  <!-- below the line -->
  <g fill="#e7ebf0" stroke="#b9c2cd">
    <rect x="170" y="288" width="118" height="42" rx="3"/>
    <rect x="426" y="288" width="118" height="42" rx="3"/>
    <rect x="682" y="288" width="118" height="42" rx="3"/>
  </g>
  <g font-size="11.5" fill="#6b7280" text-anchor="middle">
    <text x="229" y="314">Save a search</text>
    <text x="485" y="314">Split payment</text>
    <text x="741" y="314">Live chat</text>
  </g>

  <!-- slicing lines -->
  <g stroke="#5b6472" stroke-width="1.3" stroke-dasharray="6 4" fill="none">
    <path d="M20 145 H806"/>
    <path d="M20 205 H806"/>
  </g>
  <path d="M20 272 H806" stroke="#cf3d59" stroke-width="1.6" stroke-dasharray="6 4" fill="none"/>

  <!-- gutter labels -->
  <g font-size="12" fill="#3d4551" text-anchor="end">
    <text x="156" y="42" font-weight="600">Backbone</text>
    <text x="156" y="58" font-size="11" fill="#5b6472">the journey, in order</text>
    <text x="156" y="110" font-weight="600">Release 1</text>
    <text x="156" y="126" font-size="11" fill="#5b6472">walking skeleton</text>
    <text x="156" y="176" font-weight="600">Release 2</text>
    <text x="156" y="236" font-weight="600">Release 3</text>
    <text x="156" y="306" font-weight="600" fill="#8a5060">Below the line</text>
    <text x="156" y="322" font-size="11" fill="#8a5060">kept, not committed</text>
  </g>

  <text x="170" y="360" font-size="12" fill="#5b6472">Each cut crosses every activity: a user gets from one end of the journey to the other, crudely but completely.</text>
</svg>
