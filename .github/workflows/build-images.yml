# Builds a container image for each doc-hub component and publishes it to the
# GitHub Container Registry (ghcr.io) attached to this repository.
#
# The components are the directories built and published from here:
# doc-portal (Astro/node), doc-registry (Strapi CMS) and doc-sm (Astro/node,
# the story mapping board).
#
# doc-registry-db owns a Dockerfile too and is deliberately not built here — it
# is stock PostgreSQL plus an initdb script. If that ever changes, add it to the
# filters below and to the fallback list, and give helm/doc-registry-db a
# values-ghcr.yaml that resolves.
#
# There is no separate "npm ci && npm run build" job on purpose. Each
# Dockerfile is already multi-stage and runs the real build in its `build`
# stage, so a compile error fails this workflow just the same — without a
# second, drift-prone description of how each component is built.
#
# Images land at:
#   ghcr.io/vondacho/doc-hub/doc-portal
#   ghcr.io/vondacho/doc-hub/doc-registry
#   ghcr.io/vondacho/doc-hub/doc-sm
#
# They are nested under the repository path so GHCR links each package back to
# this repo automatically (via the org.opencontainers.image.source label set
# below) and inherits its access permissions. Note that a *newly created*
# package is private until you flip it in Packages > Package settings; a
# cluster pulling from it needs an imagePullSecret until then.
#
# To consume them from the charts, override the bare local repository name that
# helm/<component>/values.yaml defaults to:
#
#   helm upgrade --install doc-portal helm/doc-portal \
#     --set image.repository=ghcr.io/vondacho/doc-hub/doc-portal \
#     --set image.tag=sha-<short-sha> \
#     --set image.pullPolicy=IfNotPresent
name: build-images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: 'Build every component, ignoring which paths changed'
        type: boolean
        default: false

# One run per ref. A newer push supersedes an in-flight build of the same
# branch or pull request — but never of a tag, whose images are a release
# artefact and must not be cancelled half-published.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io
  # Single-arch. The runners are amd64 and doc-registry compiles better-sqlite3
  # from source, so an emulated arm64 leg would dominate the build time. To add
  # one, extend this list and enable docker/setup-qemu-action in the build job.
  PLATFORMS: linux/amd64

jobs:
  # Which components does this ref actually need rebuilt?
  changes:
    name: select components
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # JSON array of component names, consumed as the build job's matrix.
      components: ${{ steps.select.outputs.components }}
    steps:
      - uses: actions/checkout@v5

      # Skipped when everything is being built anyway: on a tag push
      # `github.event.before` is all-zeros and there is no meaningful base to
      # diff against.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.ref_type != 'tag' && inputs.all != true
        with:
          # A change to this workflow rebuilds everything, so a pipeline edit is
          # exercised against every component rather than the one that
          # happens to have been touched alongside it.
          filters: |
            workflow: &workflow
              - '.github/workflows/build-images.yml'
            doc-portal:
              - *workflow
              - 'doc-portal/**'
            doc-registry:
              - *workflow
              - 'doc-registry/**'
            doc-sm:
              - *workflow
              - 'doc-sm/**'

      - id: select
        env:
          CHANGED: ${{ steps.filter.outputs.changes || '[]' }}
        run: |
          set -euo pipefail
          # A release tag republishes the whole system: the point of v1.2.3 is
          # that every image carries it, whether or not each one changed.
          # Same for an explicit "build everything" dispatch.
          if [ "${{ github.ref_type }}" = 'tag' ] || [ "${{ inputs.all }}" = 'true' ]; then
            components='["doc-portal","doc-registry","doc-sm"]'
          else
            # paths-filter emits every matched filter name, including the
            # "workflow" helper the anchors are attached to — drop it, it is
            # not a component.
            components="$(jq -c 'map(select(. != "workflow"))' <<<"$CHANGED")"
          fi
          echo "components=$components" >> "$GITHUB_OUTPUT"
          echo "Building: $components" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.component }}
    needs: changes
    # An empty matrix is an error, not a no-op — guard the job instead.
    if: needs.changes.outputs.components != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Independent images: one failing component should not hide the state of
      # the other two.
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    steps:
      - uses: actions/checkout@v5

      # Needed for the registry cache backend and the Dockerfile `# syntax=`
      # directives; the stock docker builder supports neither.
      - uses: docker/setup-buildx-action@v3

      # Pull requests build but never publish, so there is nothing to log in
      # for — and a fork PR would not have a token that could push anyway.
      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ matrix.component }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-component cache scopes. Sharing one scope would let the
          # components evict each other's layers out of the 10 GB budget.
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          # Suppress the attestation manifest. It is only useful with a signing
          # story attached, and without one it shows up in the GHCR package list
          # as a phantom "unknown/unknown" platform next to every tag.
          provenance: false

      - name: Summarise
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### ${{ matrix.component }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
