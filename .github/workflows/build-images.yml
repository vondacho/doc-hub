# Builds a container image for each doc-hub component and publishes it to the
# GitHub Container Registry (ghcr.io) attached to this repository, then rolls
# the result onto the EC2 host provisioned by iac/.
#
# The components are the directories built and published from here:
# doc-portal (Astro/node), doc-registry (Strapi CMS), doc-sm, doc-em and doc-es
# (Astro/node — the story mapping, example mapping and event storming boards),
# and doc-registry-db (PostgreSQL).
#
# doc-registry-db is stock PostgreSQL plus an initdb script, and used to be left
# out of this workflow on the grounds that a local cluster can build it. The EC2
# host cannot: it only runs what GHCR holds, and copying 10-strapi.sql into
# iac/host/ would be a second, drift-prone description of the bootstrap. So it
# is built here like everything else, and helm/doc-registry-db/values-ghcr.yaml
# already resolves against the package this publishes.
#
# There is no separate "npm ci && npm run build" job on purpose. Each
# Dockerfile is already multi-stage and runs the real build in its `build`
# stage, so a compile error fails this workflow just the same — without a
# second, drift-prone description of how each component is built.
#
# Images land at:
#   ghcr.io/vondacho/doc-hub/doc-portal
#   ghcr.io/vondacho/doc-hub/doc-registry
#   ghcr.io/vondacho/doc-hub/doc-sm
#   ghcr.io/vondacho/doc-hub/doc-em
#   ghcr.io/vondacho/doc-hub/doc-es
#   ghcr.io/vondacho/doc-hub/doc-registry-db
#
# They are nested under the repository path so GHCR links each package back to
# this repo automatically (via the org.opencontainers.image.source label set
# below) and inherits its access permissions. Note that a *newly created*
# package is private until you flip it in Packages > Package settings; a
# cluster pulling from it needs an imagePullSecret until then.
#
# To consume them from the charts, override the bare local repository name that
# helm/<component>/values.yaml defaults to:
#
#   helm upgrade --install doc-portal helm/doc-portal \
#     --set image.repository=ghcr.io/vondacho/doc-hub/doc-portal \
#     --set image.tag=sha-<short-sha> \
#     --set image.pullPolicy=IfNotPresent
#
# The charts are the local (Rancher Desktop) path. What runs in production is
# iac/host/docker-compose.yml, rolled out by the `deploy` job below.
name: build-images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: 'Build every component, ignoring which paths changed'
        type: boolean
        default: false

# One run per ref. A newer push supersedes an in-flight build of the same
# branch or pull request — but never of a tag, whose images are a release
# artefact and must not be cancelled half-published.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io
  # Single-arch. The runners are amd64 and doc-registry compiles better-sqlite3
  # from source, so an emulated arm64 leg would dominate the build time. To add
  # one, extend this list and enable docker/setup-qemu-action in the build job.
  PLATFORMS: linux/amd64

permissions:
  id-token: write
  contents: read

jobs:
  # Which components does this ref actually need rebuilt?
  changes:
    name: select components
    runs-on: ubuntu-latest
    outputs:
      # JSON array of component names, consumed as the build job's matrix.
      components: ${{ steps.select.outputs.components }}
    steps:
      - uses: actions/checkout@v5

      # Skipped when everything is being built anyway: on a tag push
      # `github.event.before` is all-zeros and there is no meaningful base to
      # diff against.
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.ref_type != 'tag' && inputs.all != true
        with:
          # A change to this workflow rebuilds everything, so a pipeline edit is
          # exercised against every component rather than the one that
          # happens to have been touched alongside it.
          filters: |
            workflow: &workflow
              - '.github/workflows/build-images.yml'
            doc-portal:
              - *workflow
              - 'doc-portal/**'
            doc-registry:
              - *workflow
              - 'doc-registry/**'
            doc-sm:
              - *workflow
              - 'doc-sm/**'
            doc-em:
              - *workflow
              - 'doc-em/**'
            doc-es:
              - *workflow
              - 'doc-es/**'
            doc-registry-db:
              - *workflow
              - 'doc-registry-db/**'

      - id: select
        env:
          CHANGED: ${{ steps.filter.outputs.changes || '[]' }}
        run: |
          set -euo pipefail
          # A release tag republishes the whole system: the point of v1.2.3 is
          # that every image carries it, whether or not each one changed.
          # Same for an explicit "build everything" dispatch.
          if [ "${{ github.ref_type }}" = 'tag' ] || [ "${{ inputs.all }}" = 'true' ]; then
            components='["doc-portal","doc-registry","doc-sm","doc-em","doc-es","doc-registry-db"]'
          else
            # paths-filter emits every matched filter name, including the
            # "workflow" helper the anchors are attached to — drop it, it is
            # not a component.
            components="$(jq -c 'map(select(. != "workflow"))' <<<"$CHANGED")"
          fi
          echo "components=$components" >> "$GITHUB_OUTPUT"
          echo "Building: $components" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.component }}
    needs: changes
    # An empty matrix is an error, not a no-op — guard the job instead.
    if: needs.changes.outputs.components != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # Independent images: one failing component should not hide the state of
      # the others.
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    steps:
      - uses: actions/checkout@v5

      # Needed for the registry cache backend and the Dockerfile `# syntax=`
      # directives; the stock docker builder supports neither.
      - uses: docker/setup-buildx-action@v3

      # Pull requests build but never publish, so there is nothing to log in
      # for — and a fork PR would not have a token that could push anyway.
      - name: Log in to ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ matrix.component }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-component cache scopes. Sharing one scope would let the
          # components evict each other's layers out of the 10 GB budget.
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          # Suppress the attestation manifest. It is only useful with a signing
          # story attached, and without one it shows up in the GHCR package list
          # as a phantom "unknown/unknown" platform next to every tag.
          provenance: false

      - name: Summarise
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### ${{ matrix.component }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Rolls the freshly published images onto the EC2 Docker host provisioned by
  # iac/. Only `main` deploys: tags publish images, they do not promote them,
  # and a pull request has nothing to roll out.
  #
  # `always()` with an explicit build check so that a push touching only, say,
  # iac/host/Caddyfile still redeploys — that run has an empty component matrix,
  # which skips `build`, and a skipped dependency would otherwise skip this job
  # too.
  deploy:
    name: deploy to host
    needs: [changes, build]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      needs.build.result != 'failure' &&
      needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the runner mint the OIDC token that AWS exchanges for temporary
      # credentials. Without it the assume-role step fails with a missing
      # ACTIONS_ID_TOKEN_REQUEST_URL.
      id-token: write
    # One rollout at a time, and never cancelled half-applied — this is the only
    # deploy that migrates a database schema.
    concurrency:
      group: deploy-host
      cancel-in-progress: false
    environment:
      name: production
      url: https://doc-portal.obya.ch
    steps:
      - uses: actions/checkout@v5

      # No stored AWS key: the runner presents a GitHub-signed OIDC token and
      # STS returns credentials that expire with the job. The role's trust
      # policy pins this repository and this ref (see iac/oidc.tf).
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-central-1' }}
          role-session-name: doc-hub-deploy-${{ github.run_id }}

      # Ships iac/host/ to /opt/doc-hub over SSM and restarts the stack. The
      # same script runs unchanged from a laptop — without these secrets in the
      # environment it leaves /opt/doc-hub/secrets.env alone.
      #
      # Strapi will not boot without all six of its secrets, and rotating one is
      # not free: ENCRYPTION_KEY makes stored encrypted fields unreadable, and
      # APP_KEYS or ADMIN_JWT_SECRET signs every administrator out. Set them
      # once (iac/README.md prints the openssl commands) and leave them.
      - name: Deploy
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_KEYS: ${{ secrets.APP_KEYS }}
          API_TOKEN_SALT: ${{ secrets.API_TOKEN_SALT }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          TRANSFER_TOKEN_SALT: ${{ secrets.TRANSFER_TOKEN_SALT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: ./iac/deploy.sh

      - name: Summarise
        run: |
          {
            echo '### Deployed'
            echo '- https://doc-portal.obya.ch'
            echo '- https://doc-registry.obya.ch'
            echo '- https://doc-sm.obya.ch'
            echo '- https://doc-em.obya.ch'
            echo '- https://doc-es.obya.ch'
          } >> "$GITHUB_STEP_SUMMARY"
