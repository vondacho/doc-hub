<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!--
    Decorative backdrop for the banner. Vector, so it is served as-is rather
    than through astro:assets — there is nothing to resize or re-encode.
    The copy sits on a scrim applied by Hero.astro, so contrast never depends
    on this file.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220" />
      <stop offset="0.55" stop-color="#132a52" />
      <stop offset="1" stop-color="#1d4ed8" />
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.22" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0v80" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)" />
  <rect width="1600" height="900" fill="url(#grid)" />
  <rect width="1600" height="900" fill="url(#glow)" />

  <g fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="2">
    <rect x="180" y="250" width="220" height="150" rx="12" />
    <rect x="520" y="180" width="220" height="150" rx="12" />
    <rect x="520" y="470" width="220" height="150" rx="12" />
    <rect x="880" y="330" width="220" height="150" rx="12" />
    <path d="M400 325h120M400 325v220h120M740 255h140v75M740 545h140v-140" />
  </g>
</svg>
