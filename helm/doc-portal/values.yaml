# Default values for doc-portal.
# Tuned for a local single-node cluster (Rancher Desktop / Docker Desktop).

replicaCount: 1

image:
  repository: doc-portal
  # Defaults to .Chart.AppVersion when empty.
  tag: ""
  # IfNotPresent so a locally built image is used without a registry push.
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Port the standalone @astrojs/node server listens on. Injected as PORT and
# used as the container port, so the two cannot drift apart.
containerPort: 4321

serviceAccount:
  create: true
  annotations: {}
  # Defaults to the fullname template when empty.
  name: ""

podAnnotations: {}
podLabels: {}

# Update strategy, applied as-is. The portal is stateless, so a rolling update
# is always safe here.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

podSecurityContext:
  runAsNonRoot: true
  # Must match the "app" user baked into doc-portal/Dockerfile. 1000 is
  # deliberately avoided there — the node base image already uses it.
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 4321

# On by default, matching the dev-hub chart: a browser frontend nobody can open
# is not a useful default, and *.localhost costs nothing on a local cluster.
ingress:
  enabled: true
  # Empty uses the cluster's default IngressClass. Rancher Desktop ships
  # "traefik" as the default.
  className: ""
  annotations: {}
  hosts:
    - host: doc-portal.localhost
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    # No CPU limit: the Node server is bursty at startup and during SSR.
    memory: 512Mi

# Probes hit the /healthz route served by src/pages/healthz.ts. Node boots
# fast, so the startup budget is tight.
probes:
  path: /healthz
  startup:
    enabled: true
    initialDelaySeconds: 2
    periodSeconds: 2
    failureThreshold: 15
  liveness:
    enabled: true
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    periodSeconds: 5
    failureThreshold: 3

# ---------------------------------------------------------------------------
# Application configuration.
# Rendered into a ConfigMap and injected wholesale via envFrom.
#
# Every value here is a **browser-facing link, not an in-cluster call**: the
# visitor's browser resolves it, so an in-cluster address like
# http://arch-c4:8080 would be wrong even though the portal is server-rendered
# — and it would also be wrong because those releases live in the model-hub,
# api-hub and qa-hub namespaces, not this one.
#
# src/lib/links.ts reads each one through process.env at call time and falls
# back to the same default the chart ships, so an unset value and the default
# look identical in the page. Override one to something obviously wrong if you
# ever need to prove the wiring works.
# ---------------------------------------------------------------------------
app:
  # This portal's own public address. Used by /hub, the estate's front door,
  # which is served under a second host name — so doc-hub's own card there has
  # to name the portal absolutely rather than linking to `/`, which on that host
  # is /hub itself.
  docPortalUrl: http://doc-portal.localhost

  # doc-hub's three boards, listed on /hub. `storyMapperUrl` is the name doc-em
  # and doc-es already give the same address in their own charts.
  storyMapperUrl: http://doc-sm.localhost
  exampleMapperUrl: http://doc-em.localhost
  eventStormerUrl: http://doc-es.localhost

  # ba-hub's context mapper, listed on /hub. The tool that replaced
  # ba-ddd-mapper, and the one thing ba-hub publishes — it has no portal.
  baCmUrl: http://ba-cm.localhost

  # api-hub's portal — the API perspective, linked from the footer. api-hub owns
  # the contracts, their scorecards and the registry end to end.
  apiPortalUrl: http://api-portal.localhost

  # model-hub's own portal, linked from /landscape and the footer.
  modelPortalUrl: http://arch-portal.localhost

  # The C4 landscape — model-hub's LikeC4 site. Used by /landscape and by the
  # C4 panel of every product view, and reachable through /go/c4.
  modelC4Url: http://arch-c4.localhost

  # The events landscape — model-hub's EventCatalog site. Same two places.
  modelEventcatalogUrl: http://arch-eventcatalog.localhost

  # dev-hub's portal — practices, code design, stacks. Footer only.
  devPortalUrl: http://dev-portal.localhost

  # qa-hub's portal — where campaign results will come from.
  qaPortalUrl: http://qa-portal.localhost

  # The CMS holding the product registry, as the *browser* sees it. Printed on
  # /registration as the address an entry would be posted to, and the link a
  # person follows to open the admin UI.
  registryUrl: http://doc-registry.localhost

  # The same CMS, as *this server* sees it — the one entry here that is an
  # in-cluster call rather than a browser-facing link, and the only one that
  # must not be an ingress host.
  #
  # The catalog is read from it on every request: /catalog, its search and
  # pagination, and every product view under it. src/lib/links.ts keeps the two
  # addresses apart on purpose (registryUrl vs registryApiUrl) because they are
  # resolved by different resolvers and collapsing them breaks whichever caller
  # you were not thinking about.
  #
  # doc-registry is a release in this same namespace, so the Service name is
  # enough. Cross-namespace would need doc-registry.<namespace>.svc.
  registryApiUrl: http://doc-registry:1337

  # Arbitrary extra entries, merged verbatim into the same ConfigMap and so
  # injected as env vars too:
  #   extraConfig:
  #     LOG_LEVEL: debug
  extraConfig: {}

# Flags passed to the Node process, e.g. "--max-old-space-size=384".
nodeOptions: ""

# Additional raw environment variables (full valueFrom syntax available), e.g.
#   - name: REGISTRY_TOKEN
#     valueFrom:
#       secretKeyRef: { name: registry, key: token }
extraEnv: []

nodeSelector: {}
tolerations: []
affinity: {}
