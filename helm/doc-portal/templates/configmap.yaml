apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "doc-portal.fullname" . }}
  labels:
    {{- include "doc-portal.labels" . | nindent 4 }}
data:
  # All read by src/lib/links.ts through process.env at call time — by
  # /landscape, by the C4 and Events panels of every product view, by the
  # footer, and by the /go/[target] redirects.
  API_PORTAL_URL: {{ .Values.app.apiPortalUrl | quote }}
  MODEL_PORTAL_URL: {{ .Values.app.modelPortalUrl | quote }}
  MODEL_C4_URL: {{ .Values.app.modelC4Url | quote }}
  MODEL_EVENTCATALOG_URL: {{ .Values.app.modelEventcatalogUrl | quote }}
  DEV_PORTAL_URL: {{ .Values.app.devPortalUrl | quote }}
  QA_PORTAL_URL: {{ .Values.app.qaPortalUrl | quote }}
  REGISTRY_URL: {{ .Values.app.registryUrl | quote }}

  # The one address in this ConfigMap the *portal* resolves rather than the
  # visitor's browser: the catalog is fetched during server-side rendering. An
  # ingress host here would leave the cluster and come back in to reach a
  # Service one DNS name away — and would break entirely the moment the ingress
  # is disabled, which the in-cluster name does not care about.
  REGISTRY_API_URL: {{ .Values.app.registryApiUrl | quote }}
  {{- range $key, $value := .Values.app.extraConfig }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
