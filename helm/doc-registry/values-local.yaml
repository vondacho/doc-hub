# Overrides for a locally built image on a single-node cluster
# (Rancher Desktop / Docker Desktop).
#
#   ./helm/doc-registry/deploy.sh
#
# or by hand:
#
#   cd doc-registry && docker build -t doc-registry:dev .
#   helm upgrade --install doc-registry helm/doc-registry \
#     -n doc-hub --create-namespace \
#     -f helm/doc-registry/values-local.yaml
#   kubectl rollout restart deployment/doc-registry -n doc-hub
#
# Install helm/doc-registry-db first — Strapi migrates its schema on boot and
# will crash-loop until the database accepts connections.

image:
  repository: doc-registry
  tag: dev
  # The image is built straight into the node's image store, never pulled.
  pullPolicy: Never

# Rancher Desktop runs Traefik as the default IngressClass and *.localhost
# resolves to 127.0.0.1, so the admin UI is reachable at
# http://doc-registry.localhost/admin without a port-forward. Named explicitly
# here rather than relying on the cluster default.
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: doc-registry.localhost
      paths:
        - path: /
          pathType: Prefix

app:
  # Must match the ingress host, or the admin panel's own asset and API calls
  # go to the wrong origin. It is also the address doc-portal already carries as
  # REGISTRY_URL, so the two agree without either being edited.
  url: http://doc-registry.localhost
  seedProducts: true
  publicRead: true

# doc-registry-db is deployed in the same namespace by its own chart.
database:
  host: doc-registry-db
  existingSecret: doc-registry-db

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1Gi
