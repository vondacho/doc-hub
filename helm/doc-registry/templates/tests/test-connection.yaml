apiVersion: v1
kind: Pod
metadata:
  name: {{ include "doc-registry.fullname" . }}-test-connection
  labels:
    {{- include "doc-registry.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: health
      image: curlimages/curl:8.11.1
      args:
        - --fail
        - --silent
        - --show-error
        - http://{{ include "doc-registry.fullname" . }}:{{ .Values.service.port }}{{ .Values.probes.path }}
    - name: admin
      image: curlimages/curl:8.11.1
      args:
        - --fail
        - --silent
        - --show-error
        - --output
        - /dev/null
        # The health endpoint answers before the admin bundle is served, so the
        # UI is checked separately — this is what a browser actually loads.
        - http://{{ include "doc-registry.fullname" . }}:{{ .Values.service.port }}/admin
    {{- if .Values.app.publicRead }}
    - name: content-api
      image: curlimages/curl:8.11.1
      args:
        - --fail
        - --silent
        - --show-error
        - --output
        - /dev/null
        # One URL per thing that can independently fail: this is the content
        # API, the public-role grant from src/index.ts, and the component
        # populated behind it. A 403 here means the grant did not happen; an
        # empty payload means the schema is up but the seed is not.
        - http://{{ include "doc-registry.fullname" . }}:{{ .Values.service.port }}/api/products?populate=metrics
    {{- end }}
