{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "doc-es.serviceAccountName" . }}
  labels:
    {{- include "doc-es.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The portal does not talk to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
