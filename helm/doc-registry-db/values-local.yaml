# Overrides for a locally built image on a single-node cluster
# (Rancher Desktop / Docker Desktop).
#
#   ./helm/doc-registry-db/deploy.sh
#
# or by hand:
#
#   cd doc-registry-db && docker build -t doc-registry-db:dev .
#   helm upgrade --install doc-registry-db helm/doc-registry-db \
#     -n doc-hub --create-namespace \
#     -f helm/doc-registry-db/values-local.yaml
#
# Install this before doc-registry — Strapi migrates its schema on boot and
# crash-loops until the database answers.

image:
  repository: doc-registry-db
  tag: dev
  # The image is built straight into the node's image store, never pulled.
  pullPolicy: Never

# Fixed password locally so the database stays reachable with a known
# credential from a psql shell. Never do this outside a local cluster — leave
# it empty and let the chart generate one.
auth:
  password: strapi

persistence:
  enabled: true
  # local-path is Rancher Desktop's default StorageClass.
  storageClass: local-path
  size: 2Gi

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
