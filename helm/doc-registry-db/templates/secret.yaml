{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "doc-registry-db.fullname" . }}
  labels:
    {{- include "doc-registry-db.labels" . | nindent 4 }}
  annotations:
    # The password is generated on first install and read back on every
    # subsequent one (see the doc-registry-db.password helper), so this Secret
    # must survive a `helm uninstall` of the release only if the PVC does too.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # Consumed by the container's entrypoint. doc-registry mounts the same key
  # through a secretKeyRef rather than keeping a second copy.
  POSTGRES_PASSWORD: {{ include "doc-registry-db.password" . | quote }}
{{- end }}
