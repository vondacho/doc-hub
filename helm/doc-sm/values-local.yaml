# Overrides for a locally built image on a single-node cluster
# (Rancher Desktop / Docker Desktop).
#
#   ./helm/doc-sm/deploy.sh
#
# or by hand:
#
#   cd doc-sm && docker build -t doc-sm:dev .
#   helm upgrade --install doc-sm helm/doc-sm \
#     -n doc-hub --create-namespace \
#     -f helm/doc-sm/values-local.yaml
#   kubectl rollout restart deployment/doc-sm -n doc-hub

image:
  repository: doc-sm
  tag: dev
  # The image is built straight into the node's image store, never pulled.
  pullPolicy: Never

# Rancher Desktop runs Traefik as the default IngressClass and *.localhost
# resolves to 127.0.0.1, so the portal is reachable from the host browser
# without a port-forward. Named explicitly here rather than relying on the
# cluster default.
ingress:
  enabled: true
  className: traefik
  hosts:
    - host: doc-sm.localhost
      paths:
        - path: /
          pathType: Prefix

# doc-portal and doc-registry are separate releases in this same namespace.
# The first two are the ingress hosts their own values-local.yaml files enable on
# this cluster, so both are reachable from the host browser.
#
# The third is not an ingress host and must not be: it is the in-cluster Service
# the board page reads the product list from. Install doc-registry before
# doc-sm and the picker is populated; install it after, or not at all, and the
# picker falls back to a text box — the board does not wait for it.
app:
  docPortalUrl: http://doc-portal.localhost
  registryUrl: http://doc-registry.localhost
  registryApiUrl: http://doc-registry:1337
  # No ticketing adapter runs on the local cluster, so stories stay unlinked and
  # "create a ticket" is disabled with its reason. Point this at an adapter to
  # exercise the path.
  ticketingApiUrl: ""

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
