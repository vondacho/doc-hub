apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "doc-sm.fullname" . }}
  labels:
    {{- include "doc-sm.labels" . | nindent 4 }}
data:
  # Read by src/lib/links.ts through process.env at call time. The first two are
  # **browser-facing links** — the visitor's browser resolves them, so an
  # in-cluster address would be wrong.
  DOC_PORTAL_URL: {{ .Values.app.docPortalUrl | quote }}
  REGISTRY_URL: {{ .Values.app.registryUrl | quote }}

  # The one address here the *server* resolves rather than the visitor's
  # browser: the board page reads the registered products from it on every
  # request, to fill the product picker. An ingress host here would leave the
  # cluster and come back in to reach a Service one DNS name away — and would
  # break entirely the moment the ingress is disabled, which the in-cluster name
  # does not care about.
  #
  # This is the only request doc-sm makes. If it fails, the picker degrades to a
  # text box and the board still works; see src/lib/products.ts.
  REGISTRY_API_URL: {{ .Values.app.registryApiUrl | quote }}

  # The ticketing system doc-sm raises tickets against, also in-cluster.
  #
  # Empty by default, and empty is a working state: with no ticketing system
  # attached every story is simply unlinked and reads Open, and the control that
  # would raise a ticket says why it cannot. Rendered unconditionally so that
  # clearing it is a value change rather than a template change.
  TICKETING_API_URL: {{ .Values.app.ticketingApiUrl | quote }}
  {{- range $key, $value := .Values.app.extraConfig }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
