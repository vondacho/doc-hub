# Default values for doc-sm.
# Tuned for a local single-node cluster (Rancher Desktop / Docker Desktop).

replicaCount: 1

image:
  repository: doc-sm
  # Defaults to .Chart.AppVersion when empty.
  tag: ""
  # IfNotPresent so a locally built image is used without a registry push.
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Port the standalone @astrojs/node server listens on. Injected as PORT and
# used as the container port, so the two cannot drift apart.
containerPort: 4322

serviceAccount:
  create: true
  annotations: {}
  # Defaults to the fullname template when empty.
  name: ""

podAnnotations: {}
podLabels: {}

# Update strategy, applied as-is. The portal is stateless, so a rolling update
# is always safe here.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

podSecurityContext:
  runAsNonRoot: true
  # Must match the "app" user baked into doc-sm/Dockerfile. 1000 is
  # deliberately avoided there — the node base image already uses it.
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 4322

# On by default, matching the dev-hub chart: a browser frontend nobody can open
# is not a useful default, and *.localhost costs nothing on a local cluster.
ingress:
  enabled: true
  # Empty uses the cluster's default IngressClass. Rancher Desktop ships
  # "traefik" as the default.
  className: ""
  annotations: {}
  hosts:
    - host: doc-sm.localhost
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    # No CPU limit: the Node server is bursty at startup and during SSR.
    memory: 512Mi

# Probes hit the /healthz route served by src/pages/healthz.ts. Node boots
# fast, so the startup budget is tight.
probes:
  path: /healthz
  startup:
    enabled: true
    initialDelaySeconds: 2
    periodSeconds: 2
    failureThreshold: 15
  liveness:
    enabled: true
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    enabled: true
    periodSeconds: 5
    failureThreshold: 3

# ---------------------------------------------------------------------------
# Application configuration.
# Rendered into a ConfigMap and injected wholesale via envFrom.
#
# Two browser-facing links and one in-cluster call, and the distinction is the
# same one doc-portal draws: a link is resolved by the visitor's browser and must
# be an address the browser can reach; a call is made by this server and must
# not be.
#
# The call is new. doc-sm held nothing and asked nothing of anyone until the
# board grew a product picker, and a picker needs a list of products. What it
# does *not* mean is that the map itself goes anywhere: a story map is still a
# file the visitor picked, edited in their browser and exported back out. The
# registry supplies one dropdown, and the chart still has no Secret and no
# volume.
#
# src/lib/links.ts reads each one through process.env at call time and falls back
# to the same default the chart ships, so an unset value and the default look
# identical in the page.
# ---------------------------------------------------------------------------
app:
  # doc-hub's own portal — the product catalogue a story map is written about.
  # Linked from the board's footer.
  docPortalUrl: http://doc-portal.localhost

  # The registry's admin UI, as the browser sees it — where somebody goes to
  # register a product that is missing from the picker.
  registryUrl: http://doc-registry.localhost

  # The same registry, as *this server* sees it. Read once per render of the
  # board page to fill the product picker, and the only request doc-sm makes.
  #
  # The default is the dev-server address; the chart's own value below is what
  # the cluster uses. doc-registry is a release in this same namespace, so the
  # Service name is enough — cross-namespace would need
  # doc-registry.<namespace>.svc.
  #
  # An unreachable registry is not an outage here. doc-portal answers 503 when
  # its catalog fetch fails, because a catalog it cannot read is the page. This
  # page is a board, and the registry only fills one control, so a failure
  # degrades to a text box for the shortname and the board opens as usual.
  registryApiUrl: http://doc-registry:1337

  # The ticketing system, as this server sees it. Global configuration, and the
  # second and last in-cluster call doc-sm makes.
  #
  # **Empty by default, and that is a working state.** doc-sm does not issue
  # ticket ids or decide statuses — the ticketing system does — so with nothing
  # configured every story is unlinked, reads Open, and the "create a ticket"
  # control is disabled with the reason on it. A guessed default would turn "not
  # configured" into "configured wrongly", which is far harder to diagnose.
  #
  # This must name an **adapter**, not a tracker's own API. doc-sm speaks two
  # calls — POST /tickets and GET /tickets/{id}, described at the top of
  # src/lib/ticketing.ts — and Jira, GitHub and Azure DevOps each spell issue
  # creation differently and each want credentials. Keeping an adapter in front
  # keeps a vendor SDK, a Secret and an opinion about which tracker a team uses
  # out of this component, which is why this chart still has no Secret.
  ticketingApiUrl: ""

  # Arbitrary extra entries, merged verbatim into the same ConfigMap and so
  # injected as env vars too:
  #   extraConfig:
  #     LOG_LEVEL: debug
  extraConfig: {}

# Flags passed to the Node process, e.g. "--max-old-space-size=384".
nodeOptions: ""

# Additional raw environment variables (full valueFrom syntax available).
extraEnv: []

nodeSelector: {}
tolerations: []
affinity: {}
